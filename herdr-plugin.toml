# Wirk's Herdr plugin manifest.
#
# `command` values are argv arrays; Herdr never runs them through a
# shell (plugins.mdx, "Manifest"), so every entry below starts `bash`
# itself. Runtime commands run with the plugin directory as their
# working directory (plugins.mdx, "Commands and environment"), and this
# manifest lives at the repository root, so `plugin/*.sh` resolves
# there and `$HERDR_PLUGIN_ROOT` is the repository root.
#
# Binary resolution, in every entry below: `WIRK_BIN_PATH` if set, else
# `${CARGO_TARGET_DIR:-$HERDR_PLUGIN_ROOT/target}/debug/wirk`.

id = "wirk"
name = "Wirk"
version = "0.1.0"
# The oldest Herdr that supports what this plugin uses (plugins.mdx,
# "Manifest": "the oldest Herdr version that supports the plugin APIs,
# event names, and manifest fields your plugin uses"), which is not the
# same fact as the version it was last tested on. Everything
# `assistant` calls -- `tab create --workspace/--cwd/--label/--env`,
# `agent start --kind --pane`, `agent prompt` -- is present in the
# 0.8.2 CLI surface, so 0.8.2 it stays; testing on a newer binary is
# not a reason to raise it.
min_herdr_version = "0.8.2"
description = "Durable work engine: talk to Wirk, watch and claim Work"
platforms = ["linux"]

[[startup]]
command = ["bash", "plugin/startup.sh"]

# The human entry: a Wirk conversation in a pane of its own, in the
# harness the operator chose. See plugin/assistant.sh -- the harness
# list is Herdr's own, and the persona is this repository's AGENTS.md,
# reached through the pane's working directory rather than copied.
#
# This replaces the former `submit` action, which invoked
# `wirk work submit --intent ... --base HEAD`: `--intent` no longer
# exists and the verb now requires repository bindings and a route, so
# that action was refused at parse and admitted nothing. Those are
# choices a person makes about a particular outcome, not constants a
# menu entry can carry, so the fix is a conversation that can ask for
# them and then call `wirk work submit` with real values.
[[actions]]
id = "assistant"
title = "Talk to Wirk"
contexts = ["workspace"]
command = ["bash", "plugin/assistant.sh"]

[[actions]]
id = "claim"
title = "File a claim"
contexts = ["pane"]
command = ["bash", "-c", '''
WIRK_BIN="${WIRK_BIN_PATH:-${CARGO_TARGET_DIR:-$HERDR_PLUGIN_ROOT/target}/debug/wirk}"
exec "$WIRK_BIN" claim
''']

[[actions]]
id = "wirkd-status"
title = "wirkd status"
contexts = ["workspace"]
command = ["bash", "-c", '''
WIRK_BIN="${WIRK_BIN_PATH:-${CARGO_TARGET_DIR:-$HERDR_PLUGIN_ROOT/target}/debug/wirk}"
ESTATE="$(cat "$HERDR_PLUGIN_CONFIG_DIR/estate" 2>/dev/null || true)"
if [ -z "$ESTATE" ]; then
    echo "wirk wirkd-status: no estate configured"
    exit 0
fi
# `--admin` is named rather than omitted. This is a workspace action
# reading the estate the operator configured, so the administrative
# read is what it means; saying so keeps it true whatever execution
# triple the pane happens to have inherited, instead of reaching the
# widest surface by staying silent.
exec "$WIRK_BIN" wirkd status --estate "$ESTATE" --admin
''']

# One status pane, split rather than overlay. The pane's own program is
# the blocking journal stream itself -- no loop, no sleep. It runs
# until wirkd is gone (the stream's own EOF) or the pane closes; when
# wirkd is not running, `wirk wirkd watch` prints why and exits, and
# Herdr's "pane program ended" shows that state rather than a hidden
# retry loop.
[[panes]]
id = "status"
title = "Work status"
placement = "split"
command = ["bash", "-c", '''
WIRK_BIN="${WIRK_BIN_PATH:-${CARGO_TARGET_DIR:-$HERDR_PLUGIN_ROOT/target}/debug/wirk}"
ESTATE="$(cat "$HERDR_PLUGIN_CONFIG_DIR/estate" 2>/dev/null || true)"
if [ -z "$ESTATE" ]; then
    echo "wirk status: no estate configured"
    exit 0
fi
# `--admin` named for the same reason as the status action above: the
# operator's own pane over the operator's own configured estate, said
# rather than defaulted to.
exec "$WIRK_BIN" wirkd watch --estate "$ESTATE" --admin
''']
