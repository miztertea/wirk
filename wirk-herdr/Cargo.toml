[package]
name = "wirk-herdr"
version = "0.1.0"
edition = "2024"

# R5: installed dependencies, used the ordinary way; versions pinned to
# what W3's build brief names as already in the offline registry cache.
[dependencies]
wirk-core = { path = "../wirk-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"

[dev-dependencies]
# P4.1: the worker-contract tests hash the bytes they reserved and the
# bytes actually delivered and compare them. Same pin the crate's own
# `[dependencies]` already carry (R2); an integration test is a separate
# crate and does not inherit them.
sha2 = "0.11.0"
# Same, for reading back the opencode overlay this increment extends.
serde_json = "1.0.151"
# tests/socket.rs's tempdir sockets (R2/R5: same pin already used by
# wirk/Cargo.toml and wirk-core/Cargo.toml's fixtures, ruling 0031
# D97's latest-then-pin, checked 2026-09-04 there).
tempfile = "3.27.0"
