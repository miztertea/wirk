[package]
name = "wirk"
version = "0.1.0"
edition = "2024"

[dependencies]
wirk-core = { path = "../wirk-core" }
wirk-herdr = { path = "../wirk-herdr" }
wirk-atlas = { path = "../wirk-atlas" }
# wirkd wire protocol (W2, orient/transport.md §2, §4): the Request/Reply
# envelope and the pointer file are serde types; the same pinned versions
# already used by wirk-core/Cargo.toml (0031 D97's latest-then-pin,
# checked 2026-09-04 there) — R2, not a new adoption.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# wirk/tests/journal_demo.rs's tempdirs (R5, cache-resolvable; same pin
# already used by wirk-core/Cargo.toml's Journal round-trip fixtures,
# ruling 0031 D97's latest-then-pin checked 2026-09-04).
tempfile = "3.27.0"
