[package]
name = "wirk"
version = "0.1.0"
edition = "2024"

[dependencies]
wirk-core = { path = "../wirk-core" }
wirk-herdr = { path = "../wirk-herdr" }
wirk-atlas = { path = "../wirk-atlas" }
# wirkd wire protocol (W2, orient/transport.md §2, §4): the Request/Reply
# envelope and the pointer file are serde types; the same pinned versions
# already used by wirk-core/Cargo.toml (0031 D97's latest-then-pin,
# checked 2026-09-04 there) — R2, not a new adoption.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# ChildExecutor's death-signal mechanism (0022 D78; orient/child.md §3,
# §6): `libc::prctl(PR_SET_PDEATHSIG, SIGKILL)`, R5 — the reference's
# own mechanism, not a `nix` reimplementation. Latest stable on
# crates.io today (0031 D97), checked 2026-09-04:
# `curl -s https://crates.io/api/v1/crates/libc -A wirk` ->
# max_stable_version 0.2.189 (1.0.0-alpha.4 is a prerelease, excluded);
# matches the cached series (0.2.173/.183/.186/.189).
libc = "0.2.189"
# The boundary matcher (P2.4 W1, orient/build-brief.md §8 amendment 1):
# the predecessor's own crate for the same problem
# (`refs/sergeant-rs/Cargo.toml`, S3 X2: R2/R3/R4/R5/R6 all fail for a
# hand-rolled `**`-crossing-slashes matcher; `globset` is ripgrep's own,
# `default-features = false` because the only default feature is `log`,
# which buys nothing here). Latest stable on crates.io today (0031
# D97), checked 2026-09-05: `curl -s
# https://crates.io/api/v1/crates/globset -A wirk` -> max_stable_version
# 0.4.20, matching the cached series (0.4.16/.18/.20).
globset = { version = "0.4.20", default-features = false }
# The continuation token's authenticity tag (P3 W3 second correction,
# ruling 0095; `server.rs::continuation_tag`). R5: HMAC is the standard
# construction for "did I issue this?", and this is the RustCrypto
# implementation over the `sha2` version wirk-core/wirk-atlas already
# pin — not a hand-rolled keyed hash. Latest stable on crates.io today
# (0031 D97), checked 2026-09-06:
# `curl -s https://crates.io/api/v1/crates/hmac -A wirk` ->
# max_stable_version 0.13.0 (which is the release that tracks
# digest 0.11 / sha2 0.11, already in Cargo.lock).
hmac = "0.13.0"
sha2 = "0.11.0"

[dev-dependencies]
# wirk/tests/journal_demo.rs's tempdirs (R5, cache-resolvable; same pin
# already used by wirk-core/Cargo.toml's Journal round-trip fixtures,
# ruling 0031 D97's latest-then-pin checked 2026-09-04).
tempfile = "3.27.0"
# wirk/tests/plugin_manifest.rs parses herdr-plugin.toml (item 7 W1).
# Latest stable on crates.io today (0031 D97), checked 2026-09-04:
# `curl -s https://crates.io/api/v1/crates/toml -A wirk` ->
# max_stable_version 1.1.5+spec-1.1.0.
toml = "1.1.5"
